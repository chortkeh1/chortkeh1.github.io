name: Enhance Sarcheshmeh SEO on Shahrbabak page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Shahrbabak page
        shell: python
        run: |
          from pathlib import Path

          path = Path("accounting-auditing-shahrbabak.html")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "حسابداری و حسابرسی در شهربابک | خدمات مالیاتی و حسابداری چرتکه",
              "حسابداری و حسابرسی در شهربابک | خدمات مالی مس سرچشمه و صنایع معدنی چرتکه",
              1,
          )

          text = text.replace(
              "مؤسسه حسابداری و حسابرسی چرتکه؛ ارائه خدمات حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی به شرکت‌ها و کسب‌وکارهای شهربابک، صنایع و معادن منطقه و مجموعه‌های صنعتی مرتبط با استان کرمان.",
              "مؤسسه حسابداری و حسابرسی چرتکه؛ ارائه خدمات حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی به شرکت‌ها و کسب‌وکارهای شهربابک، مجتمع مس سرچشمه، شرکت‌های پیمانکاری و مجموعه‌های صنعتی و معدنی مرتبط با استان کرمان.",
              1,
          )

          text = text.replace(
              "خدمات تخصصی حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی برای شرکت‌ها و کسب‌وکارهای شهربابک و مجموعه‌های صنعتی و معدنی استان کرمان.",
              "خدمات تخصصی حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی برای شرکت‌ها و کسب‌وکارهای شهربابک، مجتمع مس سرچشمه و مجموعه‌های صنعتی و معدنی استان کرمان.",
              1,
          )

          text = text.replace(
              "خدمات حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی در شهربابک و استان کرمان.",
              "خدمات حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی در شهربابک، مجتمع مس سرچشمه و استان کرمان.",
              1,
          )

          marker = '<section class="light">'
          if "خدمات مالی و حسابداری برای مجتمع مس سرچشمه" not in text:
              section = '''\n<section class="light">\n  <div class="wrap">\n    <div class="title">\n      <h2>خدمات مالی و حسابداری برای مجتمع مس سرچشمه و شرکت‌های مرتبط</h2>\n      <div class="line"></div>\n      <p>خدمات تخصصی برای شرکت‌های صنعتی، معدنی، پیمانکاری، تأمین‌کنندگان و مجموعه‌های مرتبط با صنعت مس در منطقه.</p>\n    </div>\n\n    <div class="grid3">\n      <div class="card">\n        <h3>مجتمع مس سرچشمه</h3>\n        <p>ارائه خدمات حسابداری، حسابرسی، مالیاتی، بیمه و مشاوره مالی برای شرکت‌ها و کسب‌وکارهای فعال در زنجیره صنعت مس و مجموعه‌های مرتبط با مجتمع مس سرچشمه.</p>\n      </div>\n      <div class="card">\n        <h3>شرکت‌های پیمانکاری و اقماری</h3>\n        <p>پشتیبانی مالی و حسابداری برای شرکت‌های پیمانکاری، مشاوران، تأمین‌کنندگان و مجموعه‌های وابسته یا طرف قرارداد با صنایع و معادن منطقه.</p>\n      </div>\n      <div class="card">\n        <h3>خدمات مالیاتی و بیمه‌ای</h3>\n        <p>مشاوره و اجرای امور مالیاتی، بیمه، تهیه گزارش‌های مالی و استقرار فرآیندهای حسابداری متناسب با نیاز شرکت‌های صنعتی و معدنی.</p>\n      </div>\n    </div>\n  </div>\n</section>\n'''
              idx = text.find(marker)
              if idx != -1:
                  text = text[:idx] + section + text[idx:]
              else:
                  text = text.replace("</main>", section + "</main>", 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/enhance-sarcheshmeh-shahrbabak-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Shahrbabak page for Sarcheshmeh industrial SEO"
          git push
