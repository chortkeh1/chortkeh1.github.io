name: Enlarge Header Branding

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge logo and brand title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_logo = '''.logo {\n\n    width: 125px;\n\n    height: 78px;'''
          new_logo = '''.logo {\n\n    width: 155px;\n\n    height: 96px;'''

          old_brand = '''.brand {\n\n    color: #d4af37;\n\n    font-size: 28px;'''
          new_brand = '''.brand {\n\n    color: #d4af37;\n\n    font-size: 34px;'''

          if old_logo not in s:
              raise SystemExit('Expected logo CSS block not found')
          if old_brand not in s:
              raise SystemExit('Expected brand CSS block not found')

          s = s.replace(old_logo, new_logo, 1)
          s = s.replace(old_brand, new_brand, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/enlarge-header.yml
          git commit -m "Enlarge header logo and brand title"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/enlarge-header.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary header workflow" || true
          git push || true
