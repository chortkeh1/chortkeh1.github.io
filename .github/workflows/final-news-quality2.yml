name: Final news quality 2

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adjust economic whitelist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    # FINAL HEADLINE SANITY FILTER v3')
          end = s.index('\n\n    output = {', start)
          replacement = '''    # FINAL HEADLINE SANITY FILTER v4\n    economic_title_terms = [\n        "اقتصاد", "اقتصادی", "تجارت", "بازرگانی", "صنعت", "صنایع", "معدن", "معادن",\n        "فولاد", "تولید", "کارخانه", "پیمانکاری", "سرمایه", "سرمایه‌گذاری", "سرمایه گذاری",\n        "بانک", "بانکی", "بورس", "سهام", "ارز", "دلار", "طلا", "تورم", "بودجه",\n        "تسهیلات", "مالیات", "مالیاتی", "اظهارنامه", "سامانه مؤدیان", "ارزش افزوده", "بیمه",\n        "تأمین اجتماعی", "تامین اجتماعی", "حسابداری", "حسابرسی", "حقوق و دستمزد", "بازار",\n        "قیمت", "صادرات", "واردات"\n    ]\n    non_economic_title_terms = [\n        "آتش", "حریق", "انفجار", "فوتبال", "استقلال", "پرسپولیس", "ورزش", "سینما", "فیلم",\n        "بازیگر", "موسیقی", "هنر", "فرهنگ", "رونمایی", "مستند", "سردار", "جنگ", "حمله",\n        "حوادث", "پزشکی", "بیمار", "دارو", "گردشگری", "تئاتر"\n    ]\n\n    def whole_term(title, term):\n        pattern = r"(?<![\\wآ-ی])" + re.escape(term.lower()) + r"(?![\\wآ-ی])"\n        return re.search(pattern, title.lower()) is not None\n\n    final_news = []\n    for item in final_news:\n        title = item.get("title", "")\n        if any(whole_term(title, bad) for bad in non_economic_title_terms):\n            continue\n        if any(whole_term(title, good) for good in economic_title_terms):\n            final_news.append(item)\n        if len(final_news) >= MAX_NEWS:\n            break'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Refresh news
        run: python scripts/update_news.py

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_news.py news-data.json
          git rm .github/workflows/final-news-quality2.yml
          git commit -m "Restore useful economic news results"
          git push
