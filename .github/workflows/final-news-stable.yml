name: Stable multi-source news feed

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stabilize news filtering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')

          # Remove the experimental final post-filter so the feed never becomes empty.
          if '# FINAL HEADLINE SANITY FILTER v4' in s:
              start = s.index('    # FINAL HEADLINE SANITY FILTER v4')
              end = s.index('\n\n    output = {', start)
              s = s[:start] + '    final_news = final_news[:MAX_NEWS]' + s[end:]

          # Remove very short/ambiguous terms that created false positives such as
          # "مس" inside "مستند" or "وام" inside "وامدار".
          s = s.replace('"فولاد", "تولید", "کارخانه", "پیمانکاری", "سرمایه",', '"فولاد", "تولید", "کارخانه", "پیمانکاری", "سرمایه",')
          s = s.replace('"بورس", "سهام", "ارز", "دلار", "طلا", "تورم", "بودجه", "وام",', '"بورس", "سهام", "ارز", "دلار", "طلا", "تورم", "بودجه",')
          s = s.replace('"قیمت", "صادرات", "واردات",', '"قیمت", "صادرات", "واردات",')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Refresh news
        run: python scripts/update_news.py

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_news.py news-data.json
          git rm .github/workflows/final-news-stable.yml
          git commit -m "Stabilize diverse news feed"
          git push
