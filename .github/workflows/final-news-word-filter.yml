name: Final news word filter

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix economic keyword matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    # FINAL HEADLINE SANITY FILTER v1')
          end = s.index('\n\n    output = {', start)
          replacement = '''    # FINAL HEADLINE SANITY FILTER v2\n    economic_title_terms = [\n        "اقتصاد", "اقتصادی", "تجارت", "بازرگانی", "صنعت", "صنایع", "معدن", "معادن",\n        "فولاد", "مس", "آهن", "تولید", "کارخانه", "پیمانکاری", "سرمایه", "بانک", "بانکی",\n        "بورس", "سهام", "ارز", "دلار", "طلا", "تورم", "بودجه", "وام", "تسهیلات", "مالیات",\n        "مالیاتی", "اظهارنامه", "سامانه مؤدیان", "ارزش افزوده", "بیمه", "تأمین اجتماعی",\n        "تامین اجتماعی", "حسابداری", "حسابرسی", "حقوق و دستمزد", "بازار", "قیمت", "صادرات", "واردات",\n        "سرمایه‌گذاری", "سرمایه گذاری", "هزینه", "درآمد"\n    ]\n\n    def whole_term_in_title(title, terms):\n        text = title.lower()\n        for term in terms:\n            pattern = r"(?<![\\wآ-ی])" + re.escape(term.lower()) + r"(?![\\wآ-ی])"\n            if re.search(pattern, text):\n                return True\n        return False\n\n    final_news = [\n        item for item in final_news\n        if whole_term_in_title(item.get("title", ""), economic_title_terms)\n    ][:MAX_NEWS]'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Refresh news
        run: python scripts/update_news.py

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_news.py news-data.json
          git rm .github/workflows/final-news-word-filter.yml
          git commit -m "Use whole-word economic news filtering"
          git push
