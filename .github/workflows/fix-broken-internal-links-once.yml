name: Fix Broken Internal Links Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix broken internal links
        shell: bash
        run: |
          set -e

          for file in *.html; do
            [ -f "$file" ] || continue

            sed -i \
              -e 's/accounting-auditing-sarcheshmeh\.html/accounting-auditing-shahrbabak.html/g' \
              -e 's/accounting-auditing-raf\.sanjan\.html/accounting-auditing-rafsanjan.html/g' \
              -e 's/accounting-auditing-rafanjan\.html/accounting-auditing-rafsanjan.html/g' \
              -e 's/accounting-auditing-kahnooj-ghaleganj-manojanj-faryab-esfandegheh\.html/accounting-auditing-south-kerman.html/g' \
              "$file"
          done

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix broken internal links"
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-broken-internal-links-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-broken-internal-links-once.yml
          git commit -m "Remove one-time broken links workflow"
          git push
