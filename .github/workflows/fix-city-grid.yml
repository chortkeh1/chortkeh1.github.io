name: Fix City Grid

on:
  push:
    paths:
      - '.github/workflows/fix-city-grid.yml'

permissions:
  contents: write

jobs:
  fix-city-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove duplicate city grid
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '<section class="light seo-link-hub">'
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Duplicate city section not found.')

          end = text.find('</section>', start)
          if end == -1:
              raise SystemExit('End of duplicate city section not found.')
          end += len('</section>')

          text = text[:start] + text[end:]

          cities_marker = '<!-- =====================================================\n     CITIES\n===================================================== -->'
          marker_pos = text.find(cities_marker)
          if marker_pos == -1:
              raise SystemExit('Cities marker not found.')

          grid_pos = text.find('<div class="cities">', marker_pos)
          if grid_pos == -1:
              raise SystemExit('Main city grid not found.')

          insert_at = grid_pos + len('<div class="cities">')
          province_link = '''\n\n<a\nclass="city"\nhref="accounting-auditing-kerman-province.html"\n>\nاستان کرمان\n</a>\n'''
          text = text[:insert_at] + province_link + text[insert_at:]

          # Make the distinction between province and city explicit.
          city_grid_end = text.find('</div>', insert_at)
          if city_grid_end == -1:
              raise SystemExit('Main city grid end not found.')
          grid = text[insert_at:city_grid_end]
          grid = grid.replace('>\nکرمان\n</a>', '>\nشهر کرمان\n</a>', 1)
          text = text[:insert_at] + grid + text[city_grid_end:]

          path.write_text(text, encoding='utf-8')
          print('City grid fixed successfully.')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix duplicate city links on homepage'
            git push
          fi
