name: Fix Kahnuj link once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Kahnuj link and remove temporary workflow
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r -d '' file; do
            if grep -Fq 'accounting-auditing-kahnooj.html' "$file"; then
              sed -i 's/accounting-auditing-kahnooj\.html/accounting-auditing-south-kerman.html/g' "$file"
              echo "Fixed: $file"
              found=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.html' -print0)

          rm -f .github/workflows/fix-kahnooj-link-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if [ "$found" -eq 1 ]; then
            git commit -m "Fix Kahnuj internal link to South Kerman"
          else
            git commit -m "Remove temporary Kahnuj link fix workflow"
          fi

          git push
