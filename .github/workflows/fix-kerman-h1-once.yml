name: Fix Kerman H1 Once

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix H1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('accounting-auditing-kerman.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<h1\b[^>]*>.*?</h1>'
          matches = re.findall(pattern, s, flags=re.I | re.S)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly 1 H1, found {len(matches)}')
          new = '<h1>حسابداری و حسابرسی در شهر کرمان</h1>'
          s2 = re.sub(pattern, new, s, count=1, flags=re.I | re.S)
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accounting-auditing-kerman.html
          git commit -m 'Fix H1 for Kerman city page'
          git push
