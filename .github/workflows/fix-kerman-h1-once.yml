name: Fix Kerman H1 Once

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix H1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('accounting-auditing-kerman.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>حسابداری و حسابرسی برای کسب‌وکارهای کرمان</h1>'
          new = '<h1>حسابداری و حسابرسی در شهر کرمان</h1>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 target H1, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accounting-auditing-kerman.html
          git commit -m 'Fix H1 for Kerman city page'
          git push
