name: Fix Kerman city SEO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Kerman landing page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('accounting-auditing-kerman.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '<title>\nخدمات حسابداری در کرمان | حسابرسی و مشاوره مالی شرکت‌ها | چرتکه\n</title>':
              '<title>\nحسابداری و حسابرسی در شهر کرمان | خدمات مالیاتی شرکت‌ها | چرتکه\n</title>',
              'content="خدمات حسابداری در کرمان برای شرکت‌ها، اصناف و کسب‌وکارها؛ شامل حسابداری برون‌سپاری، حسابرسی، امور مالیاتی، بیمه، مشاوره مالی و استقرار نرم‌افزارهای مالی توسط چرتکه.">':
              'content="مؤسسه حسابداری و حسابرسی چرتکه در شهر کرمان؛ خدمات حسابداری شرکت‌ها، حسابرسی، مالیات، بیمه و تأمین اجتماعی، مشاوره مالی و استقرار سیستم‌های مالی برای کسب‌وکارها و شرکت‌های مستقر در شهر کرمان.">',
              '<meta property="og:title"\n      content="خدمات حسابداری در کرمان | چرتکه">':
              '<meta property="og:title"\n      content="حسابداری و حسابرسی در شهر کرمان | چرتکه">',
              '<meta property="og:description"\n      content="خدمات تخصصی حسابداری، حسابرسی و مشاوره مالی برای شرکت‌ها و کسب‌وکارهای کرمان.">':
              '<meta property="og:description"\n      content="خدمات تخصصی حسابداری، حسابرسی، مالیاتی و مشاوره مالی برای شرکت‌ها و کسب‌وکارهای مستقر در شهر کرمان.">',
              '"description": "مؤسسه حسابداری و حسابرسی چرتکه در کرمان؛ ارائه خدمات حسابداری، حسابرسی، مالیاتی، بیمه، مشاوره مالی، آموزش و استقرار نرم‌افزارهای مالی و سازمانی.",':
              '"description": "خدمات حسابداری و حسابرسی چرتکه برای شرکت‌ها و کسب‌وکارهای مستقر در شهر کرمان، شامل حسابداری برون‌سپاری، حسابرسی، مالیات، بیمه، مشاوره مالی و استقرار سیستم‌های مالی.",',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:80]}')
              s = s.replace(old, new, 1)

          marker = '<!-- =====================================================\n     FOOTER\n===================================================== -->'
          if marker not in s:
              marker = '<footer>'
          if 'id="kerman-city-expertise"' not in s:
              section = r'''

<!-- =====================================================
     KERMAN CITY - UNIQUE LOCAL SEO CONTENT
===================================================== -->

<section id="kerman-city-expertise" class="light">
<div class="wrap">
<div class="title">
<h2>خدمات حسابداری و حسابرسی ویژه شهر کرمان</h2>
<div class="line"></div>
<p>صفحه اختصاصی خدمات مالی برای شرکت‌ها، اصناف و کسب‌وکارهای مستقر در شهر کرمان</p>
</div>

<div class="grid3">
<div class="card">
<h3>حسابداری شرکت‌ها در شهر کرمان</h3>
<p>چرتکه خدمات حسابداری برون‌سپاری، ثبت و کنترل اسناد، تهیه گزارش‌های مالی، حقوق و دستمزد و ساماندهی فرآیندهای مالی را برای شرکت‌ها و کسب‌وکارهای مستقر در شهر کرمان ارائه می‌کند.</p>
</div>

<div class="card">
<h3>حسابرسی و کنترل مالی در کرمان</h3>
<p>بررسی اسناد و اطلاعات مالی، کنترل‌های داخلی، رسیدگی حسابرسی و مشاوره برای بهبود فرآیندهای مالی شرکت‌ها و مجموعه‌های اقتصادی شهر کرمان، متناسب با ساختار و فعالیت هر مجموعه انجام می‌شود.</p>
</div>

<div class="card">
<h3>مالیات، بیمه و تأمین اجتماعی</h3>
<p>خدمات مالیاتی و بیمه‌ای شامل اظهارنامه، ارزش افزوده، سامانه مؤدیان، حقوق و دستمزد، لیست بیمه و مشاوره تأمین اجتماعی برای کارفرمایان و واحدهای اقتصادی شهر کرمان ارائه می‌شود.</p>
</div>
</div>

<div class="card" style="margin-top:20px;">
<h3>خدمات مالی برای کسب‌وکارهای مناطق مختلف شهر کرمان</h3>
<p>این خدمات برای شرکت‌ها و کسب‌وکارهای فعال در محدوده‌های مختلف شهر کرمان از جمله مرکز شهر، خیابان امام جمعه، خیابان شریعتی، بلوار جمهوری، بلوار جمهوری اسلامی، شهرک صنعتی کرمان و سایر محدوده‌های تجاری و صنعتی شهر ارائه می‌شود. نوع خدمت بر اساس زمینه فعالیت، حجم عملیات، تعداد کارکنان و نیاز واقعی واحد مالی تعیین می‌شود.</p>
</div>

<div class="card" style="margin-top:20px;">
<h3>چه شرکت‌هایی در کرمان می‌توانند از خدمات چرتکه استفاده کنند؟</h3>
<p>شرکت‌های صنعتی و معدنی، پیمانکاران، شرکت‌های بازرگانی، واحدهای خدماتی، فروشگاه‌ها، کارگاه‌ها و سایر کسب‌وکارهای شهر کرمان می‌توانند برای حسابداری، حسابرسی، امور مالیاتی، بیمه، مشاوره مالی و استقرار نرم‌افزارهای حسابداری از خدمات چرتکه استفاده کنند.</p>
</div>

<div class="card" style="margin-top:20px;">
<h3>پرسش‌های متداول درباره حسابداری در کرمان</h3>
<p><strong>آیا خدمات حسابداری برای شرکت‌های شهر کرمان به‌صورت برون‌سپاری انجام می‌شود؟</strong><br>بله؛ متناسب با نیاز مجموعه، خدمات حسابداری و پشتیبانی واحد مالی می‌تواند به‌صورت برون‌سپاری یا در قالب خدمات موردی ارائه شود.</p>
<p><strong>آیا چرتکه خدمات مالیاتی و بیمه‌ای شرکت‌های کرمان را نیز انجام می‌دهد؟</strong><br>بله؛ خدمات مالیاتی، بیمه و تأمین اجتماعی در کنار خدمات حسابداری و حسابرسی ارائه می‌شود.</p>
<p><strong>آیا برای شرکت‌های صنعتی و معدنی شهر کرمان خدمات تخصصی وجود دارد؟</strong><br>بله؛ خدمات مالی و حسابداری برای شرکت‌های صنعتی، معدنی و پیمانکاری با توجه به ماهیت فعالیت و نیازهای مالی مجموعه طراحی می‌شود.</p>
</div>
</div>
</section>
'''
              s = s.replace(marker, section + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit page and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-kerman-seo.yml
          git add accounting-auditing-kerman.html
          git commit -m "SEO: strengthen Kerman city landing page" || exit 0
          git push
