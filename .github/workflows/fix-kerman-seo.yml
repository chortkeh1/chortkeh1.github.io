name: Fix Kerman city SEO

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kerman SEO patch
        run: python3 scripts/fix_kerman_seo.py

      - name: Commit and remove one-time patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-kerman-seo.yml scripts/fix_kerman_seo.py
          git add accounting-auditing-kerman.html
          git commit -m "SEO: strengthen Kerman city landing page"
          git push
