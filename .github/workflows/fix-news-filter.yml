name: One-time news relevance fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require economic topics in headlines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_news.py')
          s = p.read_text(encoding='utf-8')
          old = 'return has_economic_title or (has_economic_text and has_local)'
          new = 'return has_economic_title'
          if old not in s:
              raise SystemExit('Expected relevance rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Refresh news
        run: python scripts/update_news.py

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_news.py news-data.json
          git rm .github/workflows/fix-news-filter.yml
          git commit -m "Require economic topics in news headlines"
          git push
