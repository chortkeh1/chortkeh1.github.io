name: Internal Links Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Fix internal links and city references') && !contains(github.event.head_commit.message, 'Remove one-time internal link workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair internal links
        run: python scripts/internal_links_once.py
