name: Optimize Sirjan SEO

on:
  push:
    paths:
      - '.github/workflows/optimize-sirjan-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enrich Sirjan landing page
        shell: python
        run: |
          from pathlib import Path

          path = Path('accounting-auditing-sirjan.html')
          text = path.read_text(encoding='utf-8')

          marker = '<section id="sirjan-local-seo"'
          if marker in text:
              print('Sirjan SEO section already exists; nothing to do.')
              raise SystemExit(0)

          section = r'''

<section id="sirjan-local-seo" class="wrap" aria-labelledby="sirjan-local-seo-title" style="padding:70px 0 35px;">

  <div style="max-width:1050px;margin:auto;">

    <h2 id="sirjan-local-seo-title" style="color:#0f5f5a;text-align:center;font-size:32px;margin:0 0 18px;">
      خدمات تخصصی حسابداری و مالی در سیرجان
    </h2>

    <p style="font-size:17px;line-height:2.1;margin:0 0 24px;text-align:justify;">
      سیرجان یکی از مراکز مهم فعالیت‌های صنعتی، معدنی، فولادی، پیمانکاری و بازرگانی در استان کرمان است.
      به همین دلیل، شرکت‌ها و کسب‌وکارهای فعال در این منطقه علاوه بر ثبت و نگهداری حساب‌ها، به کنترل مالی،
      تهیه گزارش‌های مدیریتی، رسیدگی مالیاتی، بیمه و تأمین اجتماعی، حسابرسی و مشاوره مالی متناسب با نوع فعالیت
      خود نیاز دارند. مؤسسه حسابداری و حسابرسی چرتکه خدمات مالی و حسابداری را برای کسب‌وکارهای سیرجان و
      مجموعه‌های فعال در منطقه ارائه می‌کند.
    </p>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:28px 0;">

      <article style="background:#fff;border:1px solid #d8e3e0;border-radius:14px;padding:24px;box-shadow:0 5px 18px #0000000d;">
        <h3 style="color:#0f5f5a;margin-top:0;">حسابداری شرکت‌های سیرجان</h3>
        <p style="margin-bottom:0;line-height:2;">
          ثبت اسناد و رویدادهای مالی، تهیه صورت‌های مالی و گزارش‌های مالی، کنترل حساب‌ها و پشتیبانی از فرآیندهای
          مالی شرکت‌های صنعتی، معدنی، پیمانکاری و بازرگانی.
        </p>
      </article>

      <article style="background:#fff;border:1px solid #d8e3e0;border-radius:14px;padding:24px;box-shadow:0 5px 18px #0000000d;">
        <h3 style="color:#0f5f5a;margin-top:0;">خدمات مالیاتی و بیمه</h3>
        <p style="margin-bottom:0;line-height:2;">
          مشاوره و پیگیری امور مالیاتی، اظهارنامه‌ها، تکالیف قانونی، حقوق و دستمزد و امور مرتبط با بیمه و تأمین اجتماعی
          با توجه به شرایط و نوع فعالیت هر واحد اقتصادی.
        </p>
      </article>

      <article style="background:#fff;border:1px solid #d8e3e0;border-radius:14px;padding:24px;box-shadow:0 5px 18px #0000000d;">
        <h3 style="color:#0f5f5a;margin-top:0;">حسابرسی و مشاوره مالی</h3>
        <p style="margin-bottom:0;line-height:2;">
          بررسی اطلاعات و فرآیندهای مالی، تحلیل گزارش‌ها، مشاوره برای بهبود کنترل‌های مالی و ارائه راهکارهای مدیریتی
          برای تصمیم‌گیری بهتر مدیران.
        </p>
      </article>

    </div>

    <h2 style="color:#0f5f5a;font-size:27px;margin:35px 0 12px;">خدمات مالی برای صنایع و معادن سیرجان</h2>

    <p style="font-size:17px;line-height:2.1;text-align:justify;">
      ساختار مالی شرکت‌های صنعتی و معدنی معمولاً با حجم بالای اسناد، قراردادها، خرید و فروش، حقوق و دستمزد،
      پیمان‌ها و الزامات مالیاتی همراه است. در سیرجان و محدوده فعالیت‌های صنعتی و معدنی، از جمله مجموعه‌های مرتبط
      با گل‌گهر، شرکت‌ها می‌توانند بر اساس نیاز خود از خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی استفاده کنند.
      تمرکز این صفحه بر ارائه اطلاعات کاربردی درباره همین نیازهای مالی در سیرجان است.
    </p>

    <h2 style="color:#0f5f5a;font-size:27px;margin:35px 0 12px;">خدمات حسابداری و مالی برای شرکت‌های پیمانکاری</h2>

    <p style="font-size:17px;line-height:2.1;text-align:justify;">
      شرکت‌های پیمانکاری سیرجان با موضوعاتی مانند صورت‌وضعیت‌ها، قراردادها، هزینه‌های پروژه، حقوق و دستمزد،
      بیمه و مالیات روبه‌رو هستند. کنترل صحیح اسناد پروژه و تهیه گزارش‌های مالی منظم می‌تواند به مدیریت بهتر
      جریان نقدی و تصمیم‌گیری مالی کمک کند. برای مطالعه بیشتر درباره حسابداری پیمانکاری نیز می‌توانید
      <a href="article-contract-accounting.html" style="color:#0f5f5a;font-weight:bold;">مقاله حسابداری پیمانکاری</a>
      سایت چرتکه را مطالعه کنید.
    </p>

    <h2 style="color:#0f5f5a;font-size:27px;margin:35px 0 12px;">چه زمانی به مشاور مالی در سیرجان نیاز داریم؟</h2>

    <ul style="line-height:2.2;padding-right:24px;font-size:17px;">
      <li>راه‌اندازی یا سامان‌دهی واحد حسابداری شرکت</li>
      <li>بررسی و اصلاح فرآیند ثبت و کنترل اسناد مالی</li>
      <li>تهیه و بررسی گزارش‌های مالی و مدیریتی</li>
      <li>رسیدگی به تکالیف مالیاتی و بیمه‌ای</li>
      <li>بررسی قراردادها و عملیات مالی پروژه‌های پیمانکاری</li>
      <li>تحلیل وضعیت مالی و ارائه راهکار برای تصمیم‌های مدیریتی</li>
    </ul>

    <div style="margin-top:35px;background:#eef4f2;border-right:4px solid #d4af37;border-radius:12px;padding:24px;text-align:center;">
      <strong style="font-size:20px;color:#0f5f5a;">برای دریافت اطلاعات و مشاوره درباره خدمات حسابداری و مالی در سیرجان</strong>
      <p style="margin:10px 0 0;font-size:18px;">
        تماس: <a href="tel:09131989006" style="color:#0f5f5a;font-weight:bold;">09131989006</a>
        &nbsp; | &nbsp;
        تلفن دفتر: <a href="tel:03432476021" style="color:#0f5f5a;font-weight:bold;">034-32476021</a>
      </p>
    </div>

  </div>

</section>
'''

          close = '</body>'
          if close not in text:
              raise SystemExit('Could not find </body> in accounting-auditing-sirjan.html')

          text = text.replace(close, section + '\n' + close, 1)
          path.write_text(text, encoding='utf-8')
          print('Sirjan SEO content added successfully.')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accounting-auditing-sirjan.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'SEO: add unique Sirjan local content'
            git push
          fi
