name: Apply Chortkeh Homepage Redesign

on:
  push:
    paths:
      - 'scripts/redesign_site.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply redesign
        run: python scripts/redesign_site.py

      - name: Validate HTML basics
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              '<html lang="fa" dir="rtl">',
              'id="cities"',
              'id="news"',
              'id="services"',
              'accounting-auditing-sirjan.html',
          ]
          for item in checks:
              assert item in s, f'Missing: {item}'
          print('HTML validation passed')
          PY

      - name: Remove one-time redesign files
        run: |
          git rm scripts/redesign_site.py .github/workflows/redesign-site.yml

      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/update_news.py news-data.json
          git commit -m 'Redesign homepage and diversify news sources' || exit 0
          git push
