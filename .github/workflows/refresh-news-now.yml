name: Refresh Chortkeh News Now

on:
  push:
    paths:
      - 'scripts/update_news.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install feed parser
        run: python -m pip install feedparser

      - name: Refresh news
        run: python scripts/update_news.py

      - name: Remove one-time workflow
        run: git rm .github/workflows/refresh-news-now.yml

      - name: Commit fresh news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-data.json
          git add -u .github/workflows/refresh-news-now.yml
          git commit -m 'Refresh diverse news sources' || exit 0
          git push
