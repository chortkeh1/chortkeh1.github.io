name: Remove Knowledge Menu

on:
  push:
    paths:
      - '.github/workflows/remove-knowledge-menu.yml'

permissions:
  contents: write

jobs:
  remove-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Knowledge Center menu item
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          target = '''<a href="#knowledge">
مرکز دانش
</a>'''

          if target not in text:
              raise SystemExit('Knowledge Center menu item not found.')

          text = text.replace(target, '', 1)
          path.write_text(text, encoding='utf-8')
          print('Knowledge Center menu item removed successfully.')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/remove-knowledge-menu.yml
          git commit -m 'Remove knowledge center from homepage menu'
          git push
