name: SEO Finalize Once

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/seo_finalize_once.py'
      - '.github/workflows/seo-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[seo-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SEO metadata correction
        run: python scripts/seo_finalize_once.py

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounting-auditing-kerman.html
          git commit -m "Finalize Kerman SEO metadata [seo-finalized]"
          git push
