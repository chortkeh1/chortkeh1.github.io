          marker = '<!-- LOCAL SEO KEYWORD CLUSTER -->'

          def build_section(cfg):
              items = ''.join(f'<li><strong>{k}</strong></li>' for k in cfg['keywords'])
              links = ''.join(
                  f'<a href="{href}" class="btn btn-outline">خدمات {label}</a>'
                  for href, label in cfg['links']
              )
              links_block = f'<div class="actions">{links}</div>' if links else ''
              return f'''\n<section class="light" id="local-seo-services">\n<div class="wrap">\n<div class="title">\n<h2>{cfg['title']}</h2>\n<div class="line"></div>\n<p>خدمات تخصصی چرتکه برای شرکت‌ها، اصناف، پیمانکاران و کسب‌وکارهای {cfg['place']}؛ شامل حسابداری، حسابرسی، امور مالیاتی، مشاوره مالی و استقرار نرم‌افزارهای مالی.</p>\n</div>\n<div class="grid3">\n<div class="card"><h3>حسابداری و حسابرسی</h3><p>ارائه خدمات حسابداری، حسابرسی، تهیه گزارش‌های مالی، ساماندهی دفاتر و پشتیبانی واحد مالی متناسب با نیاز کسب‌وکار.</p></div>\n<div class="card"><h3>مالیات و مشاوره مالی</h3><p>مشاوره مالیاتی، تنظیم و بررسی گزارش‌های مالی و مالیاتی، بیمه و مشاوره مدیریتی برای تصمیم‌گیری دقیق‌تر.</p></div>\n<div class="card"><h3>نرم‌افزار و استقرار سیستم مالی</h3><p>مشاوره انتخاب، استقرار و آموزش نرم‌افزارهای حسابداری و طراحی فرآیندهای مالی و انبارداری متناسب با فعالیت مجموعه.</p></div>\n</div>\n<div class="card" style="margin-top:20px;">\n<h3>عبارت‌های جستجوی مرتبط</h3>\n<ul>{items}</ul>\n<p>این خدمات با توجه به نوع فعالیت و نیاز واقعی هر مجموعه ارائه می‌شود و تمرکز سایت بر ارائه اطلاعات کاربردی و خدمات تخصصی محلی است.</p>\n{links_block}\n</div>\n</div>\n</section>\n{marker}\n'''

          changed = []
          for filename, cfg in pages.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              section = build_section(cfg)
              pos = text.lower().rfind('</main>')
              if pos == -1:
                  pos = text.lower().rfind('<footer')
              if pos == -1:
                  raise RuntimeError(f'No insertion point found in {filename}')
              text = text[:pos] + section + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(filename)

          print('Updated:', ', '.join(changed))

      - name: Commit SEO sections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add localized SEO keyword clusters" || echo "No changes to commit"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/seo-keyword-clusters-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-keyword-clusters-once.yml
          git commit -m "Remove one-time SEO keyword workflow" || echo "Workflow already removed"
          git push
