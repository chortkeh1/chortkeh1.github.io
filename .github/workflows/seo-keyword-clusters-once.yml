name: Build Local SEO Keyword Clusters Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-clusters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build localized SEO sections
        shell: python
        run: |
          from pathlib import Path

          places = {
              "index.html": ("کرمان و شهرستان‌های استان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در کرمان"),
              "accounting-auditing-kerman-province.html": ("استان کرمان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در استان کرمان"),
              "accounting-auditing-kerman.html": ("کرمان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در کرمان"),
              "accounting-auditing-sirjan.html": ("سیرجان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در سیرجان"),
              "accounting-auditing-rafsanjan.html": ("رفسنجان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در رفسنجان"),
              "accounting-auditing-shahrbabak.html": ("شهربابک و مس سرچشمه", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در شهربابک و مس سرچشمه"),
              "accounting-auditing-zarand.html": ("زرند", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در زرند"),
              "accounting-auditing-bam.html": ("بم", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در بم"),
              "accounting-auditing-jiroft.html": ("جیرفت و جنوب کرمان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در جیرفت"),
              "accounting-auditing-south-kerman.html": ("جنوب کرمان", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در جنوب کرمان"),
              "accounting-auditing-bardsir-baft-rabar.html": ("بردسیر، بافت و رابر", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در بردسیر، بافت و رابر"),
              "accounting-auditing-ravar-kuhbanan-pabdana.html": ("راور، کوهبنان و پابدانا", "خدمات حسابداری، حسابرسی، مالیاتی و مشاوره مالی در راور، کوهبنان و پابدانا"),
          }

          marker = '<!-- LOCAL SEO KEYWORD CLUSTER -->'

          def section(place, title):
              return f'''\n<section class="light" id="local-seo-services">\n<div class="wrap">\n<div class="title">\n<h2>{title}</h2>\n<div class="line"></div>\n<p>چرتکه در {place} خدمات تخصصی حسابداری و حسابرسی، امور مالیاتی، مشاوره مالی، استقرار و آموزش نرم‌افزارهای حسابداری و پشتیبانی واحد مالی شرکت‌ها و کسب‌وکارها را ارائه می‌دهد.</p>\n</div>\n<div class="grid3">\n<div class="card"><h3>حسابداری و حسابرسی</h3><p>خدمات حسابداری شرکت‌ها و کسب‌وکارها، تهیه گزارش‌های مالی، ساماندهی دفاتر، حسابرسی و پشتیبانی واحد مالی متناسب با نوع فعالیت.</p></div>\n<div class="card"><h3>مشاوره مالی و مالیاتی</h3><p>مشاوره مالیاتی، بیمه، گزارش‌های مالی و تصمیم‌گیری مدیریتی برای کاهش خطا، بهبود کنترل‌های مالی و انضباط مالی مجموعه.</p></div>\n<div class="card"><h3>نرم‌افزار حسابداری و استقرار سیستم مالی</h3><p>مشاوره انتخاب و استقرار نرم‌افزار حسابداری، آموزش کاربران و طراحی فرآیندهای مالی و انبارداری متناسب با نیاز مجموعه.</p></div>\n</div>\n<div class="card" style="margin-top:20px;">\n<h3>خدمات محلی برای شرکت‌ها و کسب‌وکارهای {place}</h3>\n<p>اگر به دنبال موسسه یا شرکت حسابداری و حسابرسی، مشاور مالیاتی یا مشاور مالی در {place} هستید، خدمات چرتکه بر اساس نوع فعالیت، اندازه مجموعه و نیاز واقعی واحد مالی ارائه می‌شود. برای شرکت‌های صنعتی، معدنی، پیمانکاری و بازرگانی نیز خدمات تخصصی و استقرار سیستم‌های مالی در نظر گرفته شده است.</p>\n</div>\n</div>\n</section>\n{marker}\n'''

          changed = []
          for filename, (place, title) in places.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              block = section(place, title)
              pos = text.lower().rfind('</main>')
              if pos == -1:
                  pos = text.lower().rfind('<footer')
              if pos == -1:
                  raise RuntimeError(f'No insertion point found in {filename}')
              path.write_text(text[:pos] + block + text[pos:], encoding='utf-8')
              changed.append(filename)

          print('Updated:', ', '.join(changed))

      - name: Commit SEO sections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add localized SEO service content" || echo "No changes to commit"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/seo-keyword-clusters-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-keyword-clusters-once.yml
          git commit -m "Remove one-time SEO keyword workflow" || echo "Workflow already removed"
          git push
