name: Strengthen Tax Page

on:
  push:
    paths:
      - 'trigger-tax-strengthen.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Strengthen tax page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tax-return-kerman.html')
          s = p.read_text(encoding='utf-8')
          old = '''<h2>خدمات اظهارنامه و امور مالیاتی چرتکه در کرمان</h2>'''
          new = '''<h2>خدمات اظهارنامه، حسابداری و مشاوره مالیاتی چرتکه در کرمان</h2>\n<p>اگر برای <strong>اظهارنامه مالیاتی در کرمان</strong> به بررسی حساب‌ها، تهیه اطلاعات مالی، کنترل اسناد یا <strong>مشاوره مالیاتی شرکت‌ها و صاحبان مشاغل</strong> نیاز دارید، خدمات مالیاتی چرتکه با خدمات حسابداری و حسابرسی مجموعه شما به‌صورت یکپارچه قابل ارائه است. برای آشنایی با خدمات محلی، <a href="accounting-auditing-kerman.html">خدمات حسابداری و حسابرسی در شهر کرمان</a> را نیز ببینید.</p>'''
          if old not in s:
              raise SystemExit('target text not found')
          if 'خدمات اظهارنامه، حسابداری و مشاوره مالیاتی چرتکه در کرمان' in s:
              raise SystemExit('already updated')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tax-return-kerman.html
          git commit -m 'Strengthen Kerman tax service page'
          git push
      - name: Remove temporary workflow and trigger
        run: |
          git rm .github/workflows/strengthen-tax.yml trigger-tax-strengthen.txt
          git commit -m 'Remove temporary tax SEO workflow'
          git push
