name: Update News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Apply site fixes
        run: |
          python scripts/apply_site_fixes.py

      - name: Run local SEO booster
        run: |
          python scripts/seo_boost.py

      - name: Fix Chortkeh brand color
        run: |
          python scripts/fix_brand_color.py

      - name: Run news updater
        run: |
          python scripts/update_news.py

      - name: Refresh approved Kerman news directly
        run: |
          python scripts/update_news_direct.py

      - name: Check generated files
        run: |
          echo "Checking generated files..."
          ls -lh news-data.json
          if [ -f news.html ]; then
            ls -lh news.html
          fi

      - name: Commit updated site and news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html accounting-auditing-sirjan.html scripts/apply_site_fixes.py scripts/fix_brand_color.py scripts/seo_boost.py scripts/update_news.py scripts/update_news_direct.py news-data.json news.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore Kerman news feed and SEO updates"
            git push
          fi
