name: Update News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Run news updater
        run: |
          python scripts/update_news.py

      - name: Check generated files
        run: |
          echo "Checking news files..."
          ls -lh news-data.json
          if [ -f news.html ]; then
            ls -lh news.html
          fi

      - name: Commit updated news
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news-data.json news.html

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Auto update news"
            git push
          fi
