name: Update News

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-news:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser requests beautifulsoup4

      - name: Run resilient Kerman news updater
        run: |
          python scripts/update_news_safe.py

      - name: Run robust SEO maintenance
        run: |
          python scripts/site_seo_maintenance.py

      - name: Strengthen Sirjan local SEO
        run: |
          python scripts/fix_sirjan_links.py

      - name: Fix Chortkeh brand color
        run: |
          python scripts/fix_brand_color.py

      - name: Check generated files
        run: |
          echo "Checking generated files..."
          ls -lh news-data.json sitemap.xml
          python - <<'PY'
          import json
          with open('news-data.json', encoding='utf-8') as f:
              data = json.load(f)
          print('NEWS COUNT:', data.get('news_count', 0))
          print('ACTIVE SOURCES:', data.get('active_sources', []))
          PY

      - name: Commit updated site and news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html accounting-auditing-*.html article-*.html scripts/site_seo_maintenance.py scripts/fix_sirjan_links.py scripts/update_news_safe.py scripts/fix_brand_color.py news-data.json news.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Improve local SEO and restore resilient news rendering"
            git push
          fi
