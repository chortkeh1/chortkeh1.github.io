name: Urgent Tax SEO Campaign Once

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tax-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply urgent tax SEO campaign
        run: |
          python3 <<'PY'
          from pathlib import Path

          campaign = '''
          <section class="light" id="urgent-tax-campaign">
          <div class="wrap">
          <div class="card" style="border-right:6px solid #d4af37;">
          <h2>آخرین فرصت اظهارنامه مالیاتی ۱۴۰۵</h2>
          <p><strong>مهلت مهم:</strong> بر اساس بخشنامه شماره ۲۰۰/۱۴۰۵/۳۶، مهلت‌های مشمول تمدید برای اظهارنامه‌های مالیاتی تا پایان روز <strong>۳۱ شهریور ۱۴۰۵</strong> ادامه دارد. وضعیت پرونده هر مؤدی باید جداگانه بررسی شود.</p>
          <p><strong>خدمات چرتکه:</strong> بررسی اطلاعات مالی، آماده‌سازی اظهارنامه عملکرد، مشاوره مالیاتی، کنترل اسناد و دفاتر، ارزش افزوده، سامانه مؤدیان و سایر خدمات مالی و حسابداری.</p>
          <div class="actions"><a class="btn btn-gold" href="tax-return-kerman.html">خدمات اظهارنامه مالیاتی در کرمان</a><a class="btn btn-outline" href="tel:09131989006">تماس فوری 09131989006</a></div>
          </div>
          </div>
          </section>
          '''

          pages = [
              'index.html',
              'accounting-auditing-kerman-province.html',
              'accounting-auditing-kerman.html',
              'accounting-auditing-sirjan.html',
              'accounting-auditing-rafsanjan.html',
              'accounting-auditing-zarand.html',
              'accounting-auditing-shahrbabak.html',
              'accounting-auditing-bardsir-baft-rabar.html',
              'accounting-auditing-ravar-kuhbanan-pabdana.html',
              'accounting-auditing-bam.html',
              'accounting-auditing-jiroft.html',
              'accounting-auditing-south-kerman.html',
          ]

          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'id="urgent-tax-campaign"' not in text:
                  text = text.replace('</body>', campaign + '\n</body>', 1)
                  p.write_text(text, encoding='utf-8')

          tax = Path('tax-return-kerman.html')
          if tax.exists():
              text = tax.read_text(encoding='utf-8')
              text = text.replace('citeturn1search4turn1search5', '')
              text = text.replace(' citeturn1search4turn1search5', '')
              tax.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          url = 'https://chortkeh1.github.io/tax-return-kerman.html'
          if url not in sm:
              entry = f'''\n  <url>\n    <loc>{url}</loc>\n    <lastmod>2026-09-08</lastmod>\n  </url>\n'''
              sm = sm.replace('</urlset>', entry + '\n</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
          PY

      - name: Commit campaign changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'sitemap.xml'
          if git diff --cached --quiet; then
            echo "No campaign changes to commit."
          else
            git commit -m "Launch urgent tax SEO campaign"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/urgent-tax-seo-campaign-once.yml
          git add .github/workflows/urgent-tax-seo-campaign-once.yml
          if git diff --cached --quiet; then
            echo "Workflow already removed."
          else
            git commit -m "Remove one-time tax SEO campaign workflow"
            git push
          fi
